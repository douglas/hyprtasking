name: Offline Compat Gate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  compat-offline:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ref: [v0.55.0, v0.56.0, v0.56.2]
    steps:
      - name: Checkout Hyprtasking
        uses: actions/checkout@v5

      - name: Checkout Hyprland ${{ matrix.ref }}
        uses: actions/checkout@v5
        with:
          repository: hyprwm/Hyprland
          ref: ${{ matrix.ref }}
          path: hyprland

      - name: Install audit dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Compat audit
        run: bash scripts/audit-compat.sh "$GITHUB_WORKSPACE/hyprland"
