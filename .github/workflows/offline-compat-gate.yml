name: Offline Compat Gate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  compat-offline:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - track: v0.54.3
            ref: v0.54.3
          - track: v0.55.0
            ref: v0.55.0
          - track: v0.56.2
            ref: v0.56.2
    steps:
      - name: Checkout Hyprtasking
        uses: actions/checkout@v5

      - name: Checkout Hyprland ${{ matrix.track }} line
        uses: actions/checkout@v5
        with:
          repository: hyprwm/Hyprland
          ref: ${{ matrix.ref }}
          path: hyprland

      - name: Install audit dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Compat audits
        run: |
          bash scripts/audit-compat.sh "$GITHUB_WORKSPACE/hyprland"
          bash scripts/audit-compat-coverage.sh
          bash scripts/audit-boundary.sh
