name: Nightly Compat Preview

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

jobs:
  preview-drift:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - track: stable
            ref: v0.54.2
            strict: true
          - track: next
            ref: v0.54.3
            strict: true
          - track: preview
            ref: main
            strict: false
    steps:
      - name: Checkout Hyprtasking
        uses: actions/checkout@v5

      - name: Checkout Hyprland source
        uses: actions/checkout@v5
        with:
          repository: hyprwm/Hyprland
          ref: ${{ matrix.ref }}
          path: hyprland

      - name: Run compat drift probes
        run: |
          set +e
          mkdir -p out
          AUDIT_FORMAT=json bash scripts/audit-compat.sh "$GITHUB_WORKSPACE/hyprland" > "out/core-${{ matrix.track }}.json"
          core_exit=$?
          AUDIT_FORMAT=json bash scripts/audit-compat-surface.sh "$GITHUB_WORKSPACE/hyprland" > "out/surface-${{ matrix.track }}.json"
          surface_exit=$?
          AUDIT_COVERAGE_FORMAT=json bash scripts/audit-compat-coverage.sh > "out/coverage-${{ matrix.track }}.json"
          coverage_exit=$?
          set -e

          echo "track=${{ matrix.track }}" >> "$GITHUB_OUTPUT"
          echo "core_exit=$core_exit" >> "$GITHUB_OUTPUT"
          echo "surface_exit=$surface_exit" >> "$GITHUB_OUTPUT"
          echo "coverage_exit=$coverage_exit" >> "$GITHUB_OUTPUT"

          {
            echo "## Nightly Compat Report (${{ matrix.track }})"
            echo "- Hyprland ref: \`${{ matrix.ref }}\`"
            echo "- core audit exit: \`$core_exit\`"
            echo "- surface audit exit: \`$surface_exit\`"
            echo "- coverage audit exit: \`$coverage_exit\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "${{ matrix.strict }}" == "true" && ( "$core_exit" -ne 0 || "$surface_exit" -ne 0 || "$coverage_exit" -ne 0 ) ]]; then
            exit 1
          fi

      - name: Upload drift artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compat-${{ matrix.track }}-json
          path: out/*.json
