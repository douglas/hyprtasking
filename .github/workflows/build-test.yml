name: Build and Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-test:
    runs-on: ubuntu-latest
    # Arch ships current Hyprland headers and pkg-config files.
    container: archlinux:latest
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git meson ninja hyprland lua \
            pixman libdrm libinput systemd-libs wayland libxkbcommon clang ripgrep

      - name: Checkout Hyprtasking
        uses: actions/checkout@v5

      - name: Source audits
        run: bash scripts/audit-source.sh

      - name: Build plugin with warnings as errors
        run: |
          meson setup build -Dwerror=true
          meson compile -C build

      - name: clang-tidy
        run: |
          # --no-gnu-unique is GCC-only and clang-tidy rejects it.
          mkdir -p build-tidy
          sed 's/ --no-gnu-unique//g' build/compile_commands.json > build-tidy/compile_commands.json
          run-clang-tidy -quiet -p build-tidy -warnings-as-errors='*' "$PWD/src/.*"

      - name: Run logic tests with sanitizers
        run: |
          meson setup build-san -Dwerror=true -Db_sanitize=address,undefined
          meson compile -C build-san logic-tests
          meson test -C build-san logic-tests --print-errorlogs

      - name: Check formatting of changed C++ lines
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          # Only lines touched by the PR; the tree predates the format config.
          output=$(git clang-format --diff FETCH_HEAD -- '*.cpp' '*.hpp' || true)
          if [[ -n "$output" && "$output" != *"did not modify any files"* \
            && "$output" != *"no modified files to format"* ]]; then
            printf '%s\n' "$output"
            exit 1
          fi
