# Minimal nested Hyprland config for hyprtasking-active-overview testing.
# Do not use this as the real desktop config.

debug {
    disable_logs = false
}

monitor = , 1280x800@60, 0x0, 1

input {
    kb_layout = us
    follow_mouse = 1
}

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 1
    layout = dwindle
}

decoration {
    rounding = 4
    shadow {
        enabled = false
    }
}

animations {
    enabled = false
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}

plugin {
    hyprtasking {
        active_only = 1
        grid:auto = 1
        grid:center_partial_rows = 1
        show_labels = 1
        wallpaper_bg = 1
    }
}

bind = SUPER, Q, exit

workspace = 1, default:true
